services:

  backend:

    build: ./backend

    container_name: devops-backend

    restart: unless-stopped

    volumes:
      - app-data:/app/data


  frontend:

    image: nginx:alpine

    container_name: devops-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend


volumes:

  app-data:
